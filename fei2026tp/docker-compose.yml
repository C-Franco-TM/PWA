services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
  django:
    image: fei2026tp:0.1
    build:
      context: .
      dockerfile: ./config/django-image/Dockerfile
    working_dir: /usr/src/app
    command: ["/bin/bash", "/app/config/django-image/runserver.sh"]
    volumes:
      - ./backend:/usr/src/app
      - ./config:/app/config
    ports:
      - "${DJANGO_PORT}:8000"
    env_file:
      - .env
    depends_on:
      - postgres
