<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Práctico02 Vue 2</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>

<div id="app">

  <h2>Lista de eventos</h2>

  <ul>
    <li v-for="e in listaeventos" :key="e.id">
      {{ e.id }} - {{ e.nombre }} - {{ e.timestamp }}
    </li>
  </ul>

</div>

<script>
new Vue({
  el: "#app",

  data: {
    eventosId: 1,
    listaeventos: []
  },

  methods: {
    agregarEvento(nombre) {
      this.listaeventos.push({
        id: this.eventosId++,
        nombre,
        timestamp: Date.now()
      });
    }
  },

  // HOOKS SIN RIESGO

  beforeCreate() {
    this.$options.methods.agregarEvento.call(this, "beforeCreate");
  //  console.log("beforeCreate")
  },

  created() {
    this.agregarEvento("created");
  //  console.log("created")
  },

  beforeMount() {
    this.agregarEvento("beforeMount");
  //  console.log("beforeMount")
  },

  mounted() {
    this.agregarEvento("mounted");
  //  console.log("mounted")
  },

//  beforeUpdate() {
//    console.log("beforeUpdate")
//  },
//  updated() {
//    console.log("updated")
//  },

  beforeDestroy() {
    this.agregarEvento("beforeDestroy");
  //  console.log("beforeDestroy")
  },

  destroyed() {
    this.agregarEvento("destroyed");
  //  console.log("destroyed")
  }

});
</script>

</body>
</html>
